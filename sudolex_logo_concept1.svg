<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 96" width="600" height="96" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .lane { }
    .veh  { animation: glide 12s linear infinite; }
    .v2 { animation-delay: 3s; }
    .v3 { animation-delay: 6s; }
    .v4 { animation-delay: 9s; }
    @keyframes glide {
      0%   { transform: translateX(-70px); }
      100% { transform: translateX(670px); }
    }
    .word { font-size: 34px; font-weight: 700; letter-spacing: 6px; fill: #111; }
    .tag  { font-size: 10px; letter-spacing: 3px; fill: #888; }
    @media (prefers-reduced-motion: reduce){ .veh{ animation: none; } }
  </style>

  <!-- lane where the convoy passes -->
  <g class="lane">
    <!-- 1. document -->
    <g class="veh" transform="translate(-70,0)">
      <g transform="translate(0,6)" fill="#111">
        <path d="M2 2 h18 l6 6 v20 h-24 z"/>
        <path d="M20 2 v6 h6 z" fill="#fff" opacity="0.9"/>
        <rect x="6" y="13" width="14" height="2" fill="#fff"/>
        <rect x="6" y="18" width="14" height="2" fill="#fff"/>
        <rect x="6" y="23" width="9"  height="2" fill="#fff"/>
      </g>
    </g>
    <!-- 2. magnifier (analysis) -->
    <g class="veh v2" transform="translate(-70,0)">
      <g transform="translate(0,6)" fill="none" stroke="#111" stroke-width="3">
        <circle cx="12" cy="12" r="9"/>
        <line x1="19" y1="19" x2="27" y2="27" stroke-linecap="round"/>
      </g>
    </g>
    <!-- 3. scale of justice (law) -->
    <g class="veh v3" transform="translate(-70,0)">
      <g transform="translate(0,4)" fill="#111">
        <rect x="13" y="2" width="2" height="24"/>
        <rect x="6" y="26" width="16" height="3" rx="1"/>
        <path d="M4 8 h20" stroke="#111" stroke-width="2"/>
        <path d="M4 8 l-3 7 h6 z"/>
        <path d="M24 8 l-3 7 h6 z"/>
      </g>
    </g>
    <!-- 4. answer bubble with check -->
    <g class="veh v4" transform="translate(-70,0)">
      <g transform="translate(0,6)">
        <path d="M2 3 h24 a3 3 0 0 1 3 3 v12 a3 3 0 0 1 -3 3 h-14 l-6 5 v-5 h-4 a3 3 0 0 1 -3 -3 v-12 a3 3 0 0 1 3 -3 z" fill="#111"/>
        <path d="M9 12 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- thin baseline under the lane -->
  <line x1="60" y1="40" x2="540" y2="40" stroke="#e2e2e2" stroke-width="1"/>

  <!-- wordmark -->
  <text x="300" y="74" text-anchor="middle" class="word">SUDOLEX</text>
  <text x="300" y="90" text-anchor="middle" class="tag">INTELLIGENCE DOCUMENTAIRE LOCALE</text>
</svg>
